<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label>
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <!-- The labels are the fields' names; the placeholder is only a hint and
         disappears as soon as the user types. They are hidden from sight, not
         from the accessibility tree. -->
    <form id="new-note">
      <label class="visually-hidden" for="title">Заголовок нотатки</label>
      <input id="title" placeholder="Заголовок" required />
      <label class="visually-hidden" for="body">Текст нотатки</label>
      <input id="body" placeholder="Текст" />
      <button type="submit">Додати</button>
    </form>

    <div class="views" role="group" aria-label="Які нотатки показати">
      <button type="button" data-view="active" aria-pressed="true">Активні</button>
      <button type="button" data-view="archived" aria-pressed="false">Архів</button>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <h2 id="list-heading" tabindex="-1">Активні нотатки</h2>
    <ul id="notes" aria-labelledby="list-heading"></ul>
    <p id="empty" role="status" hidden></p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
